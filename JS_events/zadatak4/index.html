<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popis proizvoda</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            background: #f4f7fb;
            color: #172033;
        }

        main {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -0.03em;
        }

        #proizvodi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .kartica {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(30, 41, 59, 0.08);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .kartica:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 38px rgba(30, 41, 59, 0.13);
        }

        .kartica h2 {
            margin: 0 0 16px;
            font-size: 20px;
            line-height: 1.25;
            text-transform: capitalize;
        }

        .kartica p {
            margin: 6px 0;
            color: #64748b;
        }

        .kartica strong {
            color: #172033;
        }

        .cijena {
            margin-top: auto;
            padding-top: 18px;
            font-size: 26px;
            font-weight: 800;
            color: #2563eb;
        }

        .stanje {
            align-self: flex-start;
            margin-top: 14px;
            padding: 7px 10px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: 700;
        }

        .stanje.nema-zalihe {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <main>
        <h1>Popis proizvoda</h1>
        <div id="proizvodi"></div>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
